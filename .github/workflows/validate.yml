name: Validate public projection tooling

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate.yml"
      - "tests/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Run public validation tests
        run: python -m unittest discover -s tests -v
